<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知车主挪车</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .btn-hover {
                @apply transition-all duration-300 transform hover:scale-105 hover:shadow-lg;
            }
            .card-animation {
                @apply transition-all duration-500 hover:shadow-xl;
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none;
            }
            .expandable-container {
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
            }
            .expandable-container.show {
                max-height: 200px;
                transition: max-height 0.5s ease-in;
            }
            .secondary-btn {
                @apply text-blue-600 bg-blue-50 hover:bg-blue-100 transition-colors duration-200;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans">
<div class="container mx-auto px-4 py-12 flex items-center justify-center">
    <!-- 卡片阴影和圆角优化 -->
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full card-animation border border-gray-100">
        <div class="text-center mb-8">
            <!-- 图标背景优化 -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600 text-white mb-4 shadow-md">
                <i class="fa fa-car text-2xl"></i>
            </div>
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800">超级无敌🐂🍺挪车码</h1>
        </div>

        <div class="space-y-4 mb-8">
            <div class="bg-blue-50 p-4 rounded-lg flex items-center border border-blue-100">
                <i class="fa fa-info-circle text-blue-600 mr-3"></i>
                <p class="text-gray-700">请放心使用下方功能，个人开发。</p>
            </div>
        </div>

        <!-- 主要操作按钮区域 -->
        <div class="space-y-4 mb-6">
            <button id="callBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center btn-hover shadow-md">
                <i class="fa fa-phone mr-2"></i> 直接拨打电话
            </button>
            <button id="notifyBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center btn-hover shadow-md">
                <i class="fa fa-bell mr-2"></i> 通知车主挪车
            </button>
        </div>

        <!-- 隐蔽的附加功能区域 - 视觉上与主要功能区分开 -->
        <div class="mt-8 pt-6 border-t border-gray-100 space-y-3">
            <p class="text-xs text-gray-500 mb-2">社恐专用</p>

            <!-- 留言功能 - 默认隐藏 -->
            <button id="toggleMessageBtn" class="w-full secondary-btn font-medium py-2.5 px-4 rounded-lg flex items-center justify-center btn-hover text-sm">
                <i class="fa fa-comment-o mr-2"></i>
            </button>

            <div id="messageContainer" class="expandable-container px-1">
                  <textarea
                          id="message"
                          rows="2"
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus transition-all"
                          placeholder="建议留电话（方便回拨）"
                  ></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    // 从外部传入的配置参数
    let canSendNotification = true;
    const notificationCooldown = 10;
    const phone = '13381817597'
    const pushKey = 'HvG6iQipGXmvdRPFGHgFtZ'
    const remark = '如联系不上请留言'
    document.getElementById('toggleMessageBtn').innerHTML = `<i class="fa fa-comment-o mr-2"></i> ${remark}`

    // 留言框显示/隐藏切换
    document.getElementById('toggleMessageBtn').addEventListener('click', function() {
        const messageContainer = document.getElementById('messageContainer');
        const toggleBtn = document.getElementById('toggleMessageBtn');

        messageContainer.classList.toggle('show');

        // 切换按钮文字和图标
        if (messageContainer.classList.contains('show')) {
            toggleBtn.innerHTML = '<i class="fa fa-chevron-up mr-2"></i> 点击上方通知按钮';
        } else {
            toggleBtn.innerHTML = '<i class="fa fa-comment-o mr-2"></i> ${remark}';
        }
    });

    function setButtonLoading(buttonId, isLoading, countdown = null) {
        const button = document.getElementById(buttonId);
        if (isLoading) {
            button.disabled = true;
            if (countdown !== null) {
                button.innerHTML = `<i class="fa fa-clock-o mr-2"></i> 再次通知请等待 ${countdown}秒`;
              } else {
                  button.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 处理中...';
              }
          } else {
              button.disabled = false;
              if (buttonId === "notifyBtn") {
                  button.innerHTML = '<i class="fa fa-bell mr-2"></i> 通知车主挪车';
              } else if (buttonId === "toggleMessageBtn") {
                  button.innerHTML = '<i class="fa fa-comment-o mr-2"></i> ${remark}';
              } else {
                  button.innerHTML = '<i class="fa fa-phone mr-2"></i> 直接拨打电话';
              }
          }
      }

      document.getElementById("notifyBtn").addEventListener("click", function() {
          if (!canSendNotification) {
              showNotification("操作频繁", `请${notificationCooldown}秒后再试`, "error");
              return;
          }

          const messageInput = document.getElementById("message");

          let userMessage = messageInput.value.trim();


          // 验证留言长度
          if (userMessage.length > 200) {
              showNotification("输入过长", "留言内容不能超过200个字符", "error");
              return;
          }

          // 组合留言和电话号码
          if (!userMessage) {
              userMessage = "您的车辆可能影响了他人通行，请尽快前往移动车辆。";
          }

          setButtonLoading("notifyBtn", true);

          fetch(`https://api.day.app/${pushKey}`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                  "title": "挪车通知",
                  "body": userMessage,
                  "call": 1,
                  "sound": "minuet",
                  "group": "挪车",
                  "level": "critical",
                  "action": "none"
              })
          })
              .then(response => response.json())
              .then(data => {
                  if (data.code === 200) {
                      showNotification("通知已发送", "车主将尽快收到通知并处理", "success");
                      // 清空输入框
                      messageInput.value = "";

                      // 收起展开的输入框
                      document.getElementById('messageContainer').classList.remove('show');
                      document.getElementById('toggleMessageBtn').innerHTML = '<i class="fa fa-comment-o mr-2"></i> ${remark}';

                      canSendNotification = false;
                      let countdown = notificationCooldown;
                      setButtonLoading("notifyBtn", true, countdown);

                      const countdownInterval = setInterval(() => {
                          countdown--;
                          if (countdown > 0) {
                              setButtonLoading("notifyBtn", true, countdown);
                          } else {
                              clearInterval(countdownInterval);
                              canSendNotification = true;
                              setButtonLoading("notifyBtn", false);
                          }
                      }, 1000);
                  } else {
                      showNotification("发送失败", "请稍后重试", "error");
                      setButtonLoading("notifyBtn", false);
                  }
              })
              .catch(error => {
                  setButtonLoading("notifyBtn", false);
                  console.error("Error sending notification:", error);
                  showNotification("发送出错", "请检查网络连接", "error");
              });
      });

      document.getElementById("callBtn").addEventListener("click", function() {
          window.location.href = `tel:${phone}`;
      });

      // 字符数限制
      document.getElementById("message").addEventListener("input", function() {
          const maxLength = 200;
          if (this.value.length > maxLength) {
              this.value = this.value.substring(0, maxLength);
          }
      });

      function showNotification(title, message, type) {
        const notification = document.createElement("div");
        // 调整通知位置到页面顶部中央，更加显眼
        notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg flex items-center z-50 transition-all duration-300 \${
            type === "success" ? "bg-green-50 text-green-700 border border-green-200" :
                "bg-red-50 text-red-700 border border-red-200"
        }`;

        notification.innerHTML = `
                <i class="fa ${type === "success" ? "fa-check-circle" : "fa-exclamation-circle"} mr-2"></i>
                <div>
                    <div class="font-medium">${title}</div>
                    <div class="text-sm">${message}</div>
                </div>
            `;

        document.body.appendChild(notification);

        setTimeout(() => {
            notification.classList.add("opacity-0");
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }
  </script>
</body>
</html>
